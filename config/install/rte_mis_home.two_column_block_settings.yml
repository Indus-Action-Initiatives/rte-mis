two_column_block_title: 'What RTE Section 12(1)(c)?'
two_column_block_description: 'The Right to Education Act, 2009 ensures free and compulsory education for all children aged 6 to 14 years. Section 12(1)(c) mandates private schools to reserve 25% of entry-level seats for children from economically weaker sections and disadvantaged groups.'
