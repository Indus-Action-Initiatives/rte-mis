# Troubleshooting: If PowerShell reports "lando : The term 'lando' is not recognized..."
# Steps:
# 1. If a local zero-byte 'lando' file exists in the repo root, remove it:
#    Remove-Item .\lando -Force
# 2. Install Lando for Windows using the official installer (run as Admin) or reinstall via your package manager.
# 3. If needed, add Lando's install folder to PATH and restart PowerShell:
#    setx PATH "$($env:PATH);C:\Path\To\Lando\bin"
# 4. Verify with:
#    Get-Command lando
#    lando version
# 5. To run a local executable in current folder once:
#    .\lando start

