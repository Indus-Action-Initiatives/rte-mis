# Schema for the configuration files of the rte_mis_home module.
rte_mis_home.settings:
  type: config_object
  label: 'rte_mis_home settings'
  mapping:
    banner_image:
      type: string
      label: 'Banner Image'
    two_column_block_image:
      type: string
      label: 'Two Column Block Image'
    two_column_block_title:
      type: string
      label: 'Two Column Block Title'
    two_column_block_description:
      type: string
      label: 'Two Column Block Description'
    two_column_block_link:
      type: string
      label: 'Two Column Block Link'
    feature_cards:
      type: sequence
      label: 'Feature Cards'
      sequence:
        type: mapping
        label: 'Feature Card'
        mapping:
          icon:
            type: string
            label: 'Icon'
          title:
            type: string
            label: 'Title'
          description:
            type: string
            label: 'Description'

rte_mis_home.contact_page_settings:
  type: config_object
  label: 'Contact Page Settings'
  mapping:
    page_title:
      type: label
      label: 'Page Title'
    table_title:
      type: label
      label: 'Table Title'
    cards_title:
      type: label
      label: 'Cards Title'
    table_headers:
      type: sequence
      label: 'Table Headers'
      sequence:
        type: label
        label: 'Header Text'
    table_rows:
      type: sequence
      label: 'Table Rows'
      sequence:
        type: mapping
        label: 'Row'
        mapping:
          name:
            type: label
            label: 'Name'
          designation:
            type: label
            label: 'Designation'
          section:
            type: label
            label: 'Section/Desk'
          address:
            type: text
            label: 'Address'
          contact:
            type: label
            label: 'Contact'
    contact_cards:
      type: sequence
      label: 'Contact Cards'
      sequence:
        type: mapping
        label: 'Card'
        mapping:
          department_name:
            type: label
            label: 'Department Name'
          address:
            type: text
            label: 'Address'
          phone:
            type: label
            label: 'Phone'
          email:
            type: string
            label: 'Email'
          jurisdiction:
            type: label
            label: 'Jurisdiction'

rte_mis_home.school_search_settings:
  type: config_object
  label: 'School Search Settings'
  mapping:
    title_prefix:
      type: string
      label: 'Title Prefix'
    title_highlight:
      type: string
      label: 'Title Highlight'
    search_placeholder:
      type: string
      label: 'Search Placeholder'
    search_action:
      type: string
      label: 'Search Action URL'
    filters:
      type: sequence
      label: 'Filter Columns'
      sequence:
        type: mapping
        label: 'Filter Column'
        mapping:
          label:
            type: string
            label: 'Column Label'
          placeholder:
            type: string
            label: 'Dropdown Placeholder'
          name:
            type: string
            label: 'Field Name'
          options:
            type: sequence
            label: 'Options'
            sequence:
              type: mapping
              label: 'Option'
              mapping:
                value:
                  type: string
                  label: 'Value'
                label:
                  type: string
                  label: 'Label'

rte_mis_home.application_process_settings:
  type: config_object
  label: 'Application Process Settings'
  mapping:
    title:
      type: label
      label: 'Header Title'
    subtitle:
      type: label
      label: 'Header Subtitle'
    steps:
      type: sequence
      label: 'Timeline Steps'
      sequence:
        type: mapping
        label: 'Step'
        mapping:
          icon:
            type: string
            label: 'Icon'
          title:
            type: label
            label: 'Title'
          description:
            type: label
            label: 'Description'
    show_guidelines:
      type: boolean
      label: 'Show Guidelines Section'
    guidelines_title:
      type: label
      label: 'Guidelines Title'
    guidelines_items:
      type: sequence
      label: 'Guidelines Items'
      sequence:
        type: mapping
        label: 'Guideline Item'
        mapping:
          text:
            type: label
            label: 'Text'
    button_text:
      type: label
      label: 'Button Text'
    button_link:
      type: url
      label: 'Button Link'
