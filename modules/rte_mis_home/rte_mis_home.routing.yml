rte_mis_home.admin_config:
  path: '/admin/config/rte-mis'
  defaults:
    _controller: '\Drupal\system\Controller\SystemController::systemAdminMenuBlockPage'
    _title: 'RTE MIS Home Page Configuration'
  requirements:
    _permission: 'administer site configuration'

rte_mis_home.banner_settings:
  path: '/admin/config/rte-mis/banner-settings'
  defaults:
    _title: 'Banner settings'
    _form: 'Drupal\rte_mis_home\Form\BannerSettings'
  requirements:
    _permission: 'administer site configuration'

rte_mis_home.two_column_block_settings:
  path: '/admin/config/rte-mis/two-column-block-settings'
  defaults:
    _title: 'Two Column Block settings'
