name: Book A Seat Block
description: A Call to Action banner for booking seats.
props:
  type: object
  properties:
    title:
      type: string
      title: Banner Title
    description:
      type:
        - string
        - object
      title: Banner Description
    buttons:
      type: array
      title: Buttons
      items:
        type: object
        properties:
          text:
            type: string
            title: Button Text
          link:
            type: string
            title: Button Link
    background_image:
      type:
        - string
        - "null"
      title: Background Image URL
